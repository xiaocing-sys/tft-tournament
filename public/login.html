<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 金铲铲水友赛</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #080810;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* 金色光晕背景 */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(234, 179, 8, 0.08) 0%, transparent 50%);
            animation: pulse-glow 6s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .login-container {
            background: #0f0f18;
            border: 1px solid rgba(234, 179, 8, 0.15);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(234, 179, 8, 0.05);
            padding: 40px;
            width: 90%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #eab308 0%, #f97316 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            color: #0f0f18;
            margin: 0 auto 16px;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.3);
        }
        .login-header h1 {
            color: #fbbf24;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .login-header p {
            color: #9ca3af;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #d1d5db;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #161620;
            border: 1px solid rgba(234, 179, 8, 0.15);
            border-radius: 10px;
            font-size: 14px;
            color: white;
            transition: all 0.3s;
        }
        .form-group input::placeholder {
            color: #6b7280;
        }
        .form-group input:focus {
            outline: none;
            border-color: rgba(234, 179, 8, 0.5);
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.1);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #eab308 0%, #f97316 100%);
            color: #0f0f18;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.2);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(234, 179, 8, 0.35);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        .hint {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 12px;
        }
        .debug-info {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(234, 179, 8, 0.1);
            color: #9ca3af;
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 12px;
            font-family: monospace;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .test-btn {
            width: 100%;
            padding: 10px;
            background: rgba(234, 179, 8, 0.1);
            border: 1px solid rgba(234, 179, 8, 0.2);
            border-radius: 10px;
            color: #eab308;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .test-btn:hover {
            background: rgba(234, 179, 8, 0.2);
        }
        /* 底部金色装饰线 */
        .login-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(234, 179, 8, 0.3), transparent);
            border-radius: 1px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">铲</div>
            <h1>管理员登录</h1>
            <p>金铲铲水友赛管理平台</p>
        </div>
        <div class="error-message" id="errorMessage"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="password">管理员密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="login-btn">登 录</button>
        </form>
        <div class="hint">默认密码：admin123（建议修改）</div>
        <button type="button" class="test-btn" id="testApiBtn">🔍 测试 API 连接</button>
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        // 自动检测 API 基础地址
        // file:// 协议下使用 localhost:3001，http/https 下使用当前 origin
        const API_BASE = window.location.protocol === 'file:' 
            ? 'http://localhost:3001' 
            : window.location.origin;
        
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const testApiBtn = document.getElementById('testApiBtn');
        const debugInfo = document.getElementById('debugInfo');

        // 显示调试信息
        function showDebug(msg) {
            debugInfo.style.display = 'block';
            const time = new Date().toLocaleTimeString();
            debugInfo.innerHTML += '<div>[' + time + '] ' + msg + '</div>';
            debugInfo.scrollTop = debugInfo.scrollHeight;
        }

        // 测试 API 连接
        testApiBtn.addEventListener('click', async () => {
            debugInfo.innerHTML = '';
            showDebug('🚀 开始测试 API 连接...');
            showDebug('📡 请求地址: ' + API_BASE + '/api/admin/login');
            showDebug('💡 当前协议: ' + window.location.protocol);
            if (window.location.protocol === 'file:') {
                showDebug('⚠️ 检测到本地文件访问，自动切换到 localhost:3001');
            }
            
            // 先测试健康检查
            showDebug('📡 先测试健康检查: ' + API_BASE + '/api/health');
            try {
                const healthRes = await fetch(API_BASE + '/api/health', { 
                    method: 'GET',
                    credentials: 'include',
                    signal: AbortSignal.timeout(5000)  // 5秒超时
                });
                showDebug('✅ 健康检查成功! 状态码: ' + healthRes.status);
                const healthData = await healthRes.json();
                showDebug('✅ 健康检查结果: ' + JSON.stringify(healthData));
            } catch (healthErr) {
                showDebug('❌ 健康检查失败: ' + healthErr.message);
                showDebug('💡 这说明 API 函数没有正常工作！');
                errorMessage.textContent = 'API 函数错误：' + healthErr.message + '（请检查 Vercel 部署日志）';
                errorMessage.style.display = 'block';
                return;  // 停止后续测试
            }
            
            // 健康检查通过，继续测试登录 API
            showDebug('📤 发送登录请求...');
            try {
                const res = await fetch(API_BASE + '/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ password: 'admin123' }),
                    signal: AbortSignal.timeout(10000)  // 10秒超时
                });
                
                showDebug('📥 收到响应！');
                showDebug('📊 状态码: ' + res.status + ' (' + res.statusText + ')');
                
                const data = await res.json();
                showDebug('📦 响应数据: ' + JSON.stringify(data));
                
                if (data.success) {
                    showDebug('✅ 登录成功！3秒后跳转...');
                    setTimeout(() => { window.location.href = '/'; }, 3000);
                } else {
                    showDebug('❌ 登录失败: ' + (data.error || '未知错误'));
                }
            } catch (err) {
                showDebug('❌ 网络错误: ' + err.message);
                if (err.name === 'AbortError') {
                    showDebug('💡 请求超时！API 函数可能崩溃或数据库未连接');
                }
                errorMessage.textContent = '网络错误：' + err.message;
                errorMessage.style.display = 'block';
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            // 清空之前的错误信息
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';

            try {
                showDebug('[登录] 正在发送登录请求...');
                const res = await fetch(API_BASE + '/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ password })
                });
                
                showDebug('[登录] 响应状态码: ' + res.status);
                const data = await res.json();
                showDebug('[登录] 响应数据: ' + JSON.stringify(data));

                if (data.success) {
                    showDebug('[登录] 登录成功，正在跳转...');
                    window.location.href = '/';
                } else {
                    errorMessage.textContent = data.error || '登录失败（未知错误）';
                    errorMessage.style.display = 'block';
                }
            } catch (err) {
                console.error('[登录] 错误:', err);
                errorMessage.textContent = '网络错误，请重试（' + err.message + '）';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
